name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      # Builds never need secrets; runtime validation still runs when the app starts.
      SKIP_ENV_VALIDATION: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run lint
      # Database, Valkey and S3 tests start their services with Testcontainers on the runner's Docker.
      - run: pnpm turbo run test

  gradle-plugin:
    name: Gradle plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test --no-daemon --console=plain
